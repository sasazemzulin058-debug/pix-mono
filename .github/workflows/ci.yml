name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format (biome ci)
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck

      # pix-mcp uses vitest (vi.mock, vi.hoisted) which bun test doesn't support.
      # Run it separately until migrated to bun:test.
      - name: Test
        run: bun test --path-ignore-patterns='packages/pix-mcp/tests/**'

      - name: Test (pix-mcp · vitest)
        run: bun run --cwd packages/pix-mcp test
